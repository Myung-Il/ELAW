# ELAW 로그 로테이션 — root crontab에서 매일 실행
# copytruncate: 프로세스 재시작 없이 로테이션 (gunicorn/nginx/ollama 로그 모두 적용 가능)
/volume/ELAW/logs/*.log /volume/ELAW/backend.log /volume/ELAW/backend.err.log /volume/ELAW/frontend.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
