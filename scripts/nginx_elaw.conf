# ELAW 통합 서버 — 단일 진입점 :80
# 위치: /volume/ELAW/scripts/nginx_elaw.conf (→ /etc/nginx/sites-enabled/elaw 심볼릭 링크)
# 라우팅: /static·/media → 정적 파일, /admin → Django, 나머지 → Next.js
#   (/api는 Next.js rewrites가 트레일링 슬래시를 정규화하며 백엔드로 프록시 — 기존 검증된 경로 유지)

server {
    listen 80 default_server;
    server_name _;

    # ── 접근 제어: 승인 IP만 허용 ──
    include /volume/ELAW/scripts/nginx_allowlist.conf;
    deny all;

    client_max_body_size 25m;   # 게시판 첨부파일 업로드

    # Django 관리자 (직접 라우팅)
    location /admin/ {
        proxy_pass http://127.0.0.1:9002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 정적 파일 (collectstatic 산출물 — admin CSS 등)
    location /static/ {
        alias /volume/ELAW/backend/staticfiles/;
        access_log off;
    }

    # 업로드 미디어 (DEBUG=False에서 Django가 서빙하지 않으므로 nginx가 직접)
    location /media/ {
        alias /volume/ELAW/backend/media/;
    }

    # 프론트엔드 (Next.js — /api 포함 전체)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 310s;   # AI 포트폴리오 생성(Next proxyTimeout 300s)보다 여유 있게
        proxy_send_timeout 310s;
    }
}
