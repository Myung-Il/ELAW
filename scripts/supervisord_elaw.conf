; ELAW 통합 스택 supervisord 설정
; 위치(원본): /volume/ELAW/scripts/supervisord_elaw.conf → /etc/supervisor/conf.d/elaw.conf 로 복사
; 5개 프로세스: postgres → ollama → backend(gunicorn) → frontend(next) → nginx (priority 순)
; 풀백 스택(/volume/elaw, :9000/:11434)과 포트 충돌 없음 (:5432/:11435/:9002/:3000/:80)

[program:elaw_postgres]
command=/usr/lib/postgresql/16/bin/postgres -D /volume/ELAW/data/postgres -c config_file=/etc/postgresql/16/main/postgresql.conf
user=postgres
autorestart=true
startsecs=5
stopsignal=INT
stopwaitsecs=30
stdout_logfile=/volume/ELAW/logs/postgres.log
redirect_stderr=true
priority=5

[program:elaw_ollama]
command=/volume/ELAW/runtime/ollama/bin/ollama serve
environment=OLLAMA_MODELS="/volume/ELAW/data/ollama-models",OLLAMA_HOST="127.0.0.1:11435"
autorestart=true
startsecs=5
stdout_logfile=/volume/ELAW/logs/ollama.log
redirect_stderr=true
priority=10

[program:elaw_backend]
; gthread + keep-alive 75 필수 — sync 워커는 keep-alive를 닫아 프록시 연결 재사용 시 POST 지연 (풀백에서 실측)
; timeout 300: AI 포트폴리오 생성 대기 (Next proxyTimeout 300s와 일치)
command=/volume/ELAW/.venv/bin/gunicorn config.wsgi:application --bind 127.0.0.1:9002 --workers 2 --worker-class gthread --threads 8 --keep-alive 75 --timeout 300 --access-logfile /volume/ELAW/logs/gunicorn_access.log --access-logformat "%%(t)s \"%%(r)s\" %%(s)s %%(L)ss"
directory=/volume/ELAW/backend
environment=OLLAMA_HOST="http://127.0.0.1:11435"
autorestart=true
startsecs=5
stdout_logfile=/volume/ELAW/logs/backend.log
redirect_stderr=true
priority=20

[program:elaw_frontend]
command=/volume/ELAW/frontend/node_modules/.bin/next start -H 127.0.0.1 -p 3000
directory=/volume/ELAW/frontend
environment=NODE_ENV="production",NEXT_PUBLIC_API_URL="http://127.0.0.1:9002",API_URL="http://127.0.0.1:9002"
autorestart=true
startsecs=5
stdout_logfile=/volume/ELAW/logs/frontend.log
redirect_stderr=true
priority=30

[program:elaw_nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
startsecs=5
stdout_logfile=/volume/ELAW/logs/nginx.log
redirect_stderr=true
priority=40

[program:elaw_cron]
; 일일 DB 백업(backup_db.sh) + 로그 로테이션 실행용 cron 데몬
command=/usr/sbin/cron -f
autorestart=true
startsecs=5
stdout_logfile=/volume/ELAW/logs/cron.log
redirect_stderr=true
priority=50
