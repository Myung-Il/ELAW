# ELAW nginx 접근 허용 IP 목록
# 형식: allow <IP 또는 CIDR>;  — 한 줄에 하나씩 추가
# 적용: 줄 추가 후  supervisorctl restart elaw_nginx
# (이 파일에 없는 출발지는 전부 403 차단됨)

allow 127.0.0.1;        # 컨테이너 내부 / SSH 터널 경유
allow 172.17.0.0/16;    # 도커 브리지 (호스트 매핑 경유 시 출발지 표기 대비)
allow 172.26.0.0/16;    # 학교 내부망
allow 110.13.213.214;   # 노트북 (2026-06-06 등록)

# ── 팀원 IP는 아래에 추가 ──
# allow x.x.x.x;        # 이름/등록일 주석 권장
