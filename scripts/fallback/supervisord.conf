; ELAW 풀백 서버 supervisord 설정
; 위치(풀백): /volume/elaw/scripts/supervisord.conf
; 기동: /volume/elaw/scripts/start_fallback.sh
; 4개 프로세스: ollama → backend → cloudflared → url_publisher (priority 순)

[unix_http_server]
file=/volume/elaw/runtime/supervisor.sock

[supervisord]
logfile=/volume/elaw/logs/supervisord.log
pidfile=/volume/elaw/runtime/supervisord.pid
directory=/volume/elaw
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///volume/elaw/runtime/supervisor.sock

[program:ollama]
command=/volume/elaw/runtime/ollama/bin/ollama serve
environment=OLLAMA_MODELS="/volume/elaw/ollama-models",OLLAMA_HOST="127.0.0.1:11434"
autorestart=true
startsecs=5
stdout_logfile=/volume/elaw/logs/ollama.log
redirect_stderr=true
priority=10

[program:backend]
; Transaction pooler(6543) 대응 env는 /volume/elaw/app/backend/.env에서 로드됨
; 접근 로그: 요청별 처리 시간(%(L)s초) 기록 — 전송 구간 vs 백엔드 처리 지연 분리용
; ⚠️ worker-class gthread + keep-alive 75 필수 — sync 워커는 keep-alive를 닫아버려서
;   프록시(cloudflared/Vercel)가 보관한 연결 재사용 시 POST가 ~60초 멈춤 (실측, 2026-06-05)
command=/volume/elaw/venv/bin/gunicorn config.wsgi:application --bind 127.0.0.1:9000 --workers 2 --worker-class gthread --threads 8 --keep-alive 75 --timeout 120 --access-logfile /volume/elaw/logs/gunicorn_access.log --access-logformat "%%(t)s \"%%(r)s\" %%(s)s %%(L)ss"
directory=/volume/elaw/app/backend
environment=PYTHONUTF8="1"
autorestart=true
startsecs=5
stdout_logfile=/volume/elaw/logs/backend.log
redirect_stderr=true
priority=20

[program:cloudflared]
; quick tunnel — URL은 로그에서 url_publisher가 파싱해 Supabase에 게시
command=/volume/elaw/runtime/bin/cloudflared tunnel --url http://127.0.0.1:9000 --no-autoupdate --logfile /volume/elaw/logs/cloudflared.log
autorestart=true
startsecs=5
stdout_logfile=/volume/elaw/logs/cloudflared_stdout.log
redirect_stderr=true
priority=30

[program:url_publisher]
command=/volume/elaw/venv/bin/python /volume/elaw/scripts/url_publisher.py
autorestart=true
startsecs=5
stdout_logfile=/volume/elaw/logs/url_publisher.log
redirect_stderr=true
priority=40
